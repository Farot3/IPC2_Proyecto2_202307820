<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <a class="button1" type="button" href="/">Archivo</a>
    <a class="button2" type="button" href="/reportes">Reportes</a>
    <a class="button3" type="button" href="/ayuda">Ayuda</a>
    <div class="container">
        <h1>Reportes de productos</h1>
        {% for reporte in reportes %}
        <div class="reporte">
            <h2>Producto: {{ reporte.nombre_producto }}</h2>
            <h3>Componentes</h3>
            <ul>
                {% for componente in reporte.componentes %}
                <li>{{ componente }}</li>
                {% endfor %}
            </ul>
            <h3>Tabla de Ensamblaje</h3>
            <div>{{ reporte.tabla_html | safe }}</div>
        </div>
        {% endfor %}
    </div>
</body>

</html>
